services:
  # Backend Web Service (FastAPI)
  - type: web
    name: oil-sif-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/seed.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true

  # Frontend Static Site (React/Vite)
  - type: web
    name: oil-sif-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: oil-sif-backend
          property: url
